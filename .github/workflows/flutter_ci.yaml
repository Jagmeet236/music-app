name: Flutter Client CI

on:
  push:
    branches:
      - main
      - feat/**
    paths:
      - 'client/**'
  pull_request:
    branches:
      - main
    paths:
      - 'client/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client   # 👈 VERY IMPORTANT

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3️⃣ Setup Flutter (Your Version)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      # 4️⃣ Get Dependencies
      - name: Get dependencies
        run: flutter pub get

      # 5️⃣ Analyze
      - name: Analyze project
        run: flutter analyze

      # 6️⃣ Run Tests
      - name: Run tests
        run: flutter test

      # 7️⃣ Build Debug APK
      - name: Build APK
        run: flutter build apk --debug

      # 8️⃣ Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: client/build/app/outputs/flutter-apk/app-debug.apk