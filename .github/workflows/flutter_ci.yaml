name: Flutter Client CI

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - refactor/**
    paths:
      - "client/**"

  pull_request:
    branches:
      - main
    paths:
      - "client/**"

jobs:
  build:
    name: Build Flutter Client
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      # -------------------------------
      # Checkout
      # -------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------
      # Setup Java
      # -------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # -------------------------------
      # Setup Flutter
      # -------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      # -------------------------------
      # Install Dependencies
      # -------------------------------
      - name: Get dependencies
        run: flutter pub get

      # -------------------------------
      # Build Debug APK (non-main branches)
      # -------------------------------
      - name: Build Debug APK
        if: github.ref != 'refs/heads/main'
        run: flutter build apk --debug

      - name: Upload Debug APK
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: client/build/app/outputs/flutter-apk/app-debug.apk

      # -------------------------------
      # Build Release APK (main branch only)
      # -------------------------------
      - name: Build Release APK
        if: github.ref == 'refs/heads/main'
        run: flutter build apk --release

      - name: Upload Release APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: client/build/app/outputs/flutter-apk/app-release.apk